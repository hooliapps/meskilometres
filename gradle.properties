# Memoire : le projet compte quatre modules dont un multiplateforme, 3 Go
# suffisent et evitent de reserver inutilement sur une machine de developpement.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# Aucune ressource inutile embarquee : pas de BuildConfig pour les
# bibliotheques, ni de fichiers de style non utilises.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

kotlin.code.style=official
# Le module partage declare des cibles iOS : elles ne se compilent que sur
# macOS, et sont ignorees ailleurs (voir shared/build.gradle.kts).
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=2000
